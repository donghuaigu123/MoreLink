plugins {
    id 'com.android.application'
}

android {
    namespace 'com.morelink.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.morelink.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external dependencies: pure Android framework APIs for a light build.
}
